# [무엇] 로컬 개발에 필요한 서비스들을 한 번에 띄우는 docker compose 정의 파일.
#        (docker compose = 여러 컨테이너를 하나의 설정으로 함께 실행/관리하는 도구)
# [구성] redis      = 백그라운드 작업 큐(arq)가 쓰는 인메모리 저장소. 지금은 이것만 기본 기동.
#        api/worker/web = 백엔드 API·작업 워커·프론트엔드. 아직 코드가 없어 `--profile app`로
#                         분리해 둠(기본 기동에서 제외 → 코드/Dockerfile 준비되면 함께 기동).
# [원격] PostgreSQL·MinIO는 원격 서버라 여기서 정의하지 않는다 (infrastructure §7).
# [사용] `docker compose up -d redis`        → redis만 백그라운드 기동
#        `docker compose --profile app up`   → 앱 프로세스까지 기동(준비 후)
name: document-archive-refine

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # --- 앱 프로세스 (profile: app) ---
  api:                                    # FastAPI (03-backend)
    profiles: ["app"]
    build: ./backend                      # 03-backend A1에서 backend/ + Dockerfile 생성
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0     # 컨테이너 네트워크용(.env의 localhost 오버라이드)
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:                                 # arq worker (03-backend), api와 동일 이미지
    profiles: ["app"]
    build: ./backend
    command: ["arq", "src.pipeline.worker.WorkerSettings"]
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  web:                                    # Next.js (04-frontend)
    profiles: ["app"]
    build: ./web                          # 04-frontend에서 web Dockerfile 생성
    env_file: .env
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  redis-data:
